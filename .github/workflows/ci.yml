name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: Lint, typecheck, tests, build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # lint + typecheck (server, shared, web) + server and web tests + web build
      - name: Check
        run: bun run check

  e2e:
    name: End-to-end (fetches sqld)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch sqld binary
        run: bash scripts/fetch-sqld.sh

      - name: Run end-to-end workflow
        run: bun run e2e
