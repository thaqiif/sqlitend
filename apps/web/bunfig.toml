# Applies when tests run from apps/web (`bun run --cwd apps/web test`); the server's tests are unaffected.
[test]
preload = ["./test/setup.ts"]
coverageSkipTestFiles = true
coverageReporter = ["text"]
# Fails `bun test --coverage` when any loaded file is below 70% lines or functions.
coverageThreshold = 0.7
coveragePathIgnorePatterns = ["test/**"]
